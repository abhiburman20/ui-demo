// Handle source selection change
// Clear all existing rows
function clearAllRows() {
    const allRows = document.querySelectorAll('.wrapper-flex');
    allRows.forEach(row => {
        row.remove();
    });

    rowCounter = 0;
    console.log('All rows cleared, rowCounter reset to 0');

function handleSourceChange() {
    const sourceSelect = document.getElementById('sourceSelect');
    const selectedSource = sourceSelect.value;
    const header = document.getElementById('combinationsHeader');
    
    console.log('Source changed to:', selectedSource);
    
    // Clear all existing rows when source changes
    clearAllRows();
    
    // Check if source is selected
    if (selectedSource && selectedSource !== '') {
        // Source is selected - enable combinations
        enableCombinations();
        
        // Add one blank row for the new source
        addNewRow();
        
        // Update header text based on source
        if (selectedSource === 'nielsen') {
            header.textContent = 'Category report × Category × Data Type × Measure Type Combinations';
        } else if (selectedSource === 'socio') {
            header.textContent = 'Category report × Socio Type Combinations';
        } else if (selectedSource === 'shares') {
            header.textContent = 'Category report × Data Type Combinations';
        } else {
            header.textContent = 'Category report × Category × Data Type Combinations';
        }
    } else {
        // No source selected - disable combinations
        disableCombinations();
        header.textContent = 'Please select a source to configure combinations';
    }
}

// Get all selected category reports across all rows
function getSelectedCategoryReports() {
    const selectedReports = [];
    const allIndustryChips = document.querySelectorAll('[id^="industry"][id$="-chips"] .MuiChip-label');
    allIndustryChips.forEach(chip => {
        const reportName = chip.textContent.trim();
        if (reportName) {
            selectedReports.push(reportName);
        }
    });
    return selectedReports;
}

// Update all category report dropdowns to disable selected options
function updateAllCategoryReportDropdowns() {
    const selectedReports = getSelectedCategoryReports();
    const allIndustryDropdowns = document.querySelectorAll('[id^="industry"][id$="-dropdown"]');
    
    allIndustryDropdowns.forEach(dropdown => {
        const items = dropdown.getElementsByClassName('dropdown-item');
        
        for (let item of items) {
            const reportValue = item.textContent.trim();
            
            // Get current row's selections to exclude from disabling
            const dropdownId = dropdown.id;
            const inputId = dropdownId.replace('-dropdown', '');
            const currentChipsContainer = document.getElementById(inputId + '-chips');
            const currentSelections = [];
            if (currentChipsContainer) {
                const currentChips = currentChipsContainer.querySelectorAll('.MuiChip-label');
                currentChips.forEach(chip => {
                    currentSelections.push(chip.textContent.trim());
                });
            }
            
            // If this report is selected elsewhere (not in current row), disable it
            if (selectedReports.includes(reportValue) && !currentSelections.includes(reportValue)) {
                item.style.opacity = '0.3';
                item.style.pointerEvents = 'none';
                item.style.color = '#999';
                item.style.backgroundColor = '#f5f5f5';
                item.title = 'This category report is already selected in another row';
                item.setAttribute('data-disabled', 'true');
            } else {
                item.style.opacity = '1';
                item.style.pointerEvents = 'auto';
                item.style.color = '';
                item.style.backgroundColor = '';
                item.title = '';
                item.removeAttribute('data-disabled');
            }
        }
    });
}




// Show dropdown when input is focused
function showDropdown(inputId) {
    // Check if source is selected first
    const sourceSelect = document.getElementById('sourceSelect');
    const selectedSource = sourceSelect ? sourceSelect.value : '';
    
    if (!selectedSource || selectedSource === '') {
        console.warn('Cannot show dropdown: No source selected');
        return;
    }
    
    const dropdown = document.getElementById(inputId + '-dropdown');
    if (dropdown) {
        // Update category report dropdown states if it's an industry input
        if (inputId.includes('industry')) {
            updateAllCategoryReportDropdowns();
        }
        dropdown.style.display = 'block';
    }
}

// Hide dropdown
function hideDropdown(inputId) {
    setTimeout(() => {
        const dropdown = document.getElementById(inputId + '-dropdown');
        if (dropdown) {
            dropdown.style.display = 'none';
        }
    }, 150);
}

// Filter dropdown options based on input
function filterDropdown(inputId) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(inputId + '-dropdown');
    const filter = input.value.toLowerCase();
    const items = dropdown.getElementsByClassName('dropdown-item');
    
    for (let i = 0; i < items.length; i++) {
        const text = items[i].textContent.toLowerCase();
        if (text.indexOf(filter) > -1) {
            items[i].style.display = '';
        } else {
            items[i].style.display = 'none';
        }
    }
}

// Initialize category dropdown with all available options
function initializeCategoryDropdown(categoryDropdownId) {
    const categoryDropdown = document.getElementById(categoryDropdownId);
    if (!categoryDropdown) return;
    
    // Clear existing dropdown options
    categoryDropdown.innerHTML = '';
    
    // Populate dropdown with all category options
    allCategoryOptions.forEach(category => {
        const categoryItem = document.createElement('div');
        categoryItem.className = 'dropdown-item';
        const rowNumber = categoryDropdownId.replace('category', '').replace('-dropdown', '');
        categoryItem.onclick = () => addSelection('category' + rowNumber, category);
        categoryItem.textContent = category;
        categoryDropdown.appendChild(categoryItem);
    });
}

// Check if add button should be enabled (no validation needed for multi-select)
function checkAddButtonState() {
    // Use ID selector first, then fallback methods
    let addButton = document.getElementById('addRowButton');
    if (!addButton) {
        addButton = document.querySelector('[style*="padding:10px 28px"]');
    }
    if (!addButton) {
        // Look for button with "Add" text
        const buttons = document.querySelectorAll('button');
        for (let btn of buttons) {
            if (btn.textContent.includes('Add')) {
                addButton = btn;
                break;
            }
        }
    }
    
    if (!addButton) {
        console.log('Add button not found with any selector');
        return;
    }
    
    // Always enable add button since Category report is now multi-select
    addButton.disabled = false;
    addButton.removeAttribute('disabled');
    addButton.style.opacity = '1';
    addButton.style.cursor = 'pointer';
    addButton.style.pointerEvents = 'auto';
    addButton.title = '';
    console.log('Add button ENABLED (multi-select mode)');
}

// Remove entire row
function removeRow(button) {
    const allRows = document.querySelectorAll('.wrapper-flex');
    
    // Prevent removing if only one row remains
    if (allRows.length <= 1) {
        console.log('Cannot remove the last remaining row - minimum one row required');
        return;
    }
    
    button.parentElement.remove();
    
    // Update all dropdowns since selections may have been removed
    updateAllCategoryReportDropdowns();
    
    // Check add button state
    checkAddButtonState();
    // Update cross button states
    updateCrossButtonStates();
}

// Update cross button states - disable if only one row exists
function updateCrossButtonStates() {
    const allRows = document.querySelectorAll('.wrapper-flex');
    
    // Find cross buttons - use a more direct approach
    let crossButtons = [];
    allRows.forEach(row => {
        const button = row.querySelector('button');
        if (button && button.textContent.trim() === '×') {
            crossButtons.push(button);
        }
    });
    
    console.log(`updateCrossButtonStates: Found ${allRows.length} rows and ${crossButtons.length} cross buttons`);
    console.log(`Cross buttons found:`, Array.from(crossButtons).map((btn, i) => ({
        index: i,
        onclick: btn.getAttribute('onclick') || 'none',
        text: btn.textContent.trim(),
        disabled: btn.disabled,
        opacity: btn.style.opacity
    })));
    
    crossButtons.forEach((button, index) => {
        if (allRows.length <= 1) {
            button.disabled = true;
            button.style.opacity = '0.3';
            button.style.cursor = 'not-allowed';
            button.title = 'Cannot remove the last row - minimum one row required';
            console.log(`Cross button ${index}: DISABLED (only ${allRows.length} row(s))`);
        } else {
            button.disabled = false;
            button.style.opacity = '1';
            button.style.cursor = 'pointer';
            button.title = 'Remove this row';
            console.log(`Cross button ${index}: ENABLED (${allRows.length} rows exist)`);
        }
    });
    
    console.log('=== Cross button states updated ===');
}

// Enable combinations section
function enableCombinations() {
    const rowsContainer = document.getElementById('rowsContainer');
    const addButtonContainer = document.getElementById('addButtonContainer');
    const sourcePlaceholder = document.getElementById('sourcePlaceholder');
    
    if (rowsContainer) {
        rowsContainer.style.opacity = '1';
        rowsContainer.style.pointerEvents = 'auto';
    }
    
    if (addButtonContainer) {
        addButtonContainer.style.display = 'block';
        const addButton = document.getElementById('addRowButton');
        if (addButton) {
            addButton.disabled = false;
            addButton.style.opacity = '1';
            addButton.style.cursor = 'pointer';
        }
    }
    
    // Hide the placeholder message
    if (sourcePlaceholder) {
        sourcePlaceholder.style.display = 'none';
    }
    
    console.log('Combinations section enabled');
}

// Disable combinations section
function disableCombinations() {
    const rowsContainer = document.getElementById('rowsContainer');
    const addButtonContainer = document.getElementById('addButtonContainer');
    const sourcePlaceholder = document.getElementById('sourcePlaceholder');
    
    if (rowsContainer) {
        rowsContainer.style.opacity = '1'; // Keep full opacity to show placeholder
        rowsContainer.style.pointerEvents = 'none';
        
        // Disable all inputs in existing rows
        const inputs = rowsContainer.querySelectorAll('input');
        inputs.forEach(input => {
            input.disabled = true;
            input.style.opacity = '0.5';
        });
        
        // Disable all dropdowns
        const dropdowns = rowsContainer.querySelectorAll('.dropdown-list');
        dropdowns.forEach(dropdown => {
            dropdown.style.display = 'none';
        });
        
        // Disable cross buttons
        const crossButtons = rowsContainer.querySelectorAll('button');
        crossButtons.forEach(button => {
            if (button.textContent.trim() === '×') {
                button.disabled = true;
                button.style.opacity = '0.3';
                button.style.cursor = 'not-allowed';
            }
        });
    }
    
    if (addButtonContainer) {
        addButtonContainer.style.display = 'none';
    }
    
    // Show the placeholder message
    if (sourcePlaceholder) {
        sourcePlaceholder.style.display = 'block';
    }
    
    console.log('Combinations section disabled');
}

    newRow.className = 'wrapper-flex';
    newRow.style.marginBottom = '16px';
    newRow.setAttribute('data-source', selectedSource);
    newRow.innerHTML = `
        <button style="align-self:flex-start;padding:5px 8px;margin-right:16px;" onclick="removeRow(this)">×</button>
        ${columnsHTML}
    `;
    
    container.appendChild(newRow);
    console.log('New row added with source:', selectedSource, 'Row counter:', rowCounter);
    
    // Update cross button states immediately after adding the row
    console.log('Calling updateCrossButtonStates immediately after DOM insertion');
    updateCrossButtonStates();
    
    // Small delay to ensure proper initialization
    setTimeout(() => {
        // Update add button state since we now have a new empty row
        checkAddButtonState();
        // Update cross button states again to ensure consistency
        console.log('Calling updateCrossButtonStates after timeout');
        updateCrossButtonStates();
    }, 100); // Increased delay slightly
    
    } catch(error) {
        console.error('Error in addNewRow:', error);
    }
}

// Close dropdowns when clicking outside
document.addEventListener('click', function(event) {
    // Don't close dropdowns if we're clicking on a dropdown-related element
    if (event.target.closest('.dropdown-container') || 
        event.target.closest('.dropdown-list') ||
        event.target.closest('.dropdown-item') ||
        event.target.classList.contains('dropdown-item') ||
        event.target.tagName === 'INPUT') {
        return;
    }
    
    const dropdowns = document.querySelectorAll('.dropdown-list');
    dropdowns.forEach(dropdown => {
        dropdown.style.display = 'none';
    });
});
